name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        env:
          API_URL: ${{ secrets.API_URL }}
        run: yarn build

      - name: Create static HTML for GitHub Pages routes
        run: |
          mkdir -p dist/peyber-uniformes-ng/browser/privacy-policy
          cp dist/peyber-uniformes-ng/browser/index.html dist/peyber-uniformes-ng/browser/privacy-policy/index.html
          mkdir -p dist/peyber-uniformes-ng/browser/politica-de-privacidad
          cp dist/peyber-uniformes-ng/browser/index.html dist/peyber-uniformes-ng/browser/politica-de-privacidad/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/peyber-uniformes-ng/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
