name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        env:
          API_URL: ${{ secrets.API_URL }}
        run: yarn build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/peyber-uniformes-ng/browser/index.html dist/peyber-uniformes-ng/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/peyber-uniformes-ng/browser
          branch: gh-pages
          clean: true
